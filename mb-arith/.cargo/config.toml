# Disable LLVM's SLP vectorizer so bench numbers match the server build --
# see mb-rust-server/.cargo/config.toml for the full story (SLP packs the
# BLA delta chain into shuffle-laden <2 x double>, costing 1.76x on strips).
# mb-wasm deliberately has NO such config: LLVM's wasm backend leaves this
# loop scalar on its own, and V8 compiles it well.
# Explicit triples rather than cfg(target_arch): both work, but a literal
# triple can never surprise across cargo versions. x86_64-only because the
# aarch64 backend does NOT pack this chain -- CB A/B @1 thread, clean VM:
# wasm 4.37 vs native 5.02 rows/s, the normal ~87% ratio, no anomaly; and
# an explicit RUSTFLAGS test of the flag there measured no effect -- so ARM
# builds with default flags.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "llvm-args=-slp-threshold=999999"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "llvm-args=-slp-threshold=999999"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "llvm-args=-slp-threshold=999999"]
