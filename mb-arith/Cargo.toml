# NOTE: .cargo/config.toml beside this manifest disables LLVM's SLP
# vectorizer on x86_64 (1.7x on BLA strips -- see that file and
# bmarks.txt 21 Jul 2026). Cargo has no stable way to set rustflags
# from Cargo.toml, so it lives there; this note is the signpost.
[package]
name = "mb-arith"
version = "0.1.0"
edition = "2021"
authors = ["Bill Wood <wpwoodjr@gmail.com>"]

[dependencies]
num = "*"

[dev-dependencies]
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[features]
# wasm32 SIMD128 kernels for the u32 limb engine; requires a SIMD-capable
# wasm engine (all major browsers since 2021, Safari since 16.4)
simd128 = []
