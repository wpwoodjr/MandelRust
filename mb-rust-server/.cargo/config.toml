# Disable LLVM's SLP vectorizer for server builds (and the mb-arith dep):
# the BLA delta loop is a latency-bound serial f64 chain, and SLP packs it
# into shuffle-laden <2 x double> that costs 1.76x on strip throughput
# (bench-strip-ab, 21 Jul 2026: 3.18 s -> 1.81 s on identical strips; V8's
# scalar wasm codegen was BEATING the native server until this). Same
# pathology this project measured for hand-written SIMD kernels -- packed
# shuffles lengthen the critical path -- inflicted automatically. An LLVM
# flag rename fails the build loudly, not silently.
# Explicit triples rather than cfg(target_arch): both work, but a literal
# triple can never surprise across cargo versions. x86_64-only because the
# aarch64 backend does NOT pack this chain -- CB A/B @1 thread, clean VM:
# wasm 4.37 vs native 5.02 rows/s, the normal ~87% ratio, no anomaly; and
# an explicit RUSTFLAGS test of the flag there measured no effect -- so ARM
# builds with default flags.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "llvm-args=-slp-threshold=999999"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "llvm-args=-slp-threshold=999999"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "llvm-args=-slp-threshold=999999"]
